apiVersion: v1
kind: ConfigMap
metadata:
  name: account-config
  namespace: account

  labels:
    app.kubernetes.io/name: account
    app.kubernetes.io/part-of: hsbc
    environment: prod

data:
  SPRING_PROFILES_ACTIVE: "prod"

  SERVER_PORT: "8080"

  SPRING_DATASOURCE_URL: "jdbc:mysql://<RDS_ENDPOINT>:3306/account_db?useSSL=true&requireSSL=true&serverTimezone=UTC"

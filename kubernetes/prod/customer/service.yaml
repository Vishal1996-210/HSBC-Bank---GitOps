apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: customer

  labels:
    app: customer
    app.kubernetes.io/name: customer
    app.kubernetes.io/part-of: hsbc
    environment: prod

spec:
  type: ClusterIP

  selector:
    app: customer

  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http

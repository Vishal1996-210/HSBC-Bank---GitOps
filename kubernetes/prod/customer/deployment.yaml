apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer
  namespace: customer

  labels:
    app: customer
    app.kubernetes.io/name: customer
    app.kubernetes.io/part-of: hsbc
    environment: prod

spec:
  replicas: 3

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: customer

  template:
    metadata:
      labels:
        app: customer
        app.kubernetes.io/name: customer
        app.kubernetes.io/part-of: hsbc
        environment: prod

    spec:
      serviceAccountName: customer

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: customer

          image: <AWS_ACCOUNT_ID>.dkr.ecr.ap-south-1.amazonaws.com/hsbc-prod-customer-service:IMAGE_TAG

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: customer-config
                  key: SPRING_PROFILES_ACTIVE

            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: customer-config
                  key: SERVER_PORT

            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: customer-config
                  key: SPRING_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: customer-db-secret
                  key: username

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: customer-db-secret
                  key: password

          resources:
            requests:
              cpu: 500m
              memory: 512Mi

            limits:
              cpu: 1
              memory: 1Gi

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http

            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: tmp
              mountPath: /tmp

            - name: customer-db-secret
              mountPath: /mnt/secrets-store
              readOnly: true

      volumes:
        - name: tmp
          emptyDir: {}

        - name: customer-db-secret
          csi:
            driver: secrets-store.csi.k8s.io

            readOnly: true

            volumeAttributes:
              secretProviderClass: customer-db-secret
